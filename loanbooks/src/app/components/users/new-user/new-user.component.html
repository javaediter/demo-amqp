<div class="container-fluid">
  <h3 class="text-info-emphasis mt-1">New User</h3>
  <div class="mt-1">
    <form class="g-2" #fu = "ngForm" (ngSubmit)="fu.form.valid && submitNewUser(fu)">
      <div class="row">
        <div class="col">
          <label class="form-label" for="username">Username</label>
          <input id="username" name="username" type="text" class="form-control" ngModel required />
        </div>
        <div class="col">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control" ngModel required />
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label class="form-label" for="roles">Roles</label>
          <div class="list-group">
            <li class="list-group-item" *ngFor="let rol of roles">
              <input type="checkbox" class="form-check-input me-1" value="{{ rol.substring(5) }}" (change)="takeRole($event)" />
              <label class="form-check-label">{{ rol.substring(5) }}</label>
            </li>
          </div>
        </div>
        <div class="col">
          <div class="form-check p-4">
            <input id="active" name="active" type="checkbox" class="form-check-input" ngModel required />
            <label class="form-check-label" for="active">Active</label>
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col">
          <button type="reset" class="btn btn-secondary w-50">Cancel</button>
          <button type="submit" class="btn btn-primary w-50">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>
