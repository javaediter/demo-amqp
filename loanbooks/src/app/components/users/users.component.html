<div class="container-fluid">
  <h3 class="text-info-emphasis mt-1">Users</h3>
  <div class="mt-1">
    <table class="table table-striped table-hover">
      <thead>
      <tr>
        <th>Nº</th>
        <th>Username</th>
        <th>Active</th>
        <th>Roles</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
        @for (user of users; track $index){
          <tr>
            <td>{{ $index + 1 }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.active }}</td>
            <td>
              <ul>
                <li *ngFor="let rol of user.roles">{{ rol.substring(5) }}</li>
              </ul>
            </td>
            <td>
              @if(user.active){
                <button type="button" class="btn btn-danger m-1" data-bs-target="#updateModal" data-bs-toggle="modal"
                        title="unactive" (click)="selectUser(user, false)">
                  <span class="bi-ban"></span>
                </button>
              }@else{
                <button type="button" class="btn btn-success m-1" data-bs-target="#updateModal" data-bs-toggle="modal"
                        title="active" (click)="selectUser(user, true)">
                  <span class="bi-check2-circle"></span>
                </button>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<div id="updateModal" class="modal fade" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-info-subtle">
        <h5 class="modal-title fs-5">Change status</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-info-emphasis text-center">Do you want to change the status of {{ userSelected.username }}?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
        <button type="button" class="btn btn-info" (click)="updateStatusUser()">Yes</button>
      </div>
    </div>
  </div>
</div>
