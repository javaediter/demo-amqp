<div class="container d-flex justify-content-center align-items-center my-5">
    <div class="card p-4 shadow-sm" style="width: 25rem;">
        <h3 class="text-center mb-4">Login</h3>
        <form #f="ngForm" (ngSubmit)="f.form.valid && login(f)">
            <div>
                <input class="form-control mb-3" type="email" name="email" placeholder="Email" ngModel required />
            </div>
            <div>
                <input class="form-control mb-3" type="password" name="password" placeholder="Password" ngModel required />
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <div class="text-center mt-2">
          @if (!success){
            <p class="text-danger">Login failed</p>
          }
        </div>
    </div>
</div>
