spring.application.name=publisher

server.port=9090

#CORS
cors.frontend.app=${FRONTEND_APP}

spring.datasource.url=${URL_DB}
spring.datasource.username=${USER_DB}
spring.datasource.password=${PASWD_DB}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}

logging.level.org.springframework.amqp=DEBUG

#Rabbit Config
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#AMQP Config
amqp.loans.topic.name=loans.topic

#Cron Scheduler
#Every five minutes from Monday to Friday. Does not run on Saturday and Sunday
cron.job=0 */5 * * * MON-FRI

#Logging
logging.group.web=org.springframework.http, org.springframework.web
logging.level.web=DEBUG
logging.file.name=logs/logs-publisher